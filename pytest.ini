[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
addopts = -ra

markers =
    backend: Backend test suite
    api: Backend API tests
    scheduler: Scheduler tests
    db: Database-backed/integration tests
    pipeline: Pipeline construction/execution tests
    worker: Worker runtime/client tests
    evaluators: Evaluator tests
    security: Security-focused tests
    integration: Cross-component integration tests
    smoke: Fast sanity checks
