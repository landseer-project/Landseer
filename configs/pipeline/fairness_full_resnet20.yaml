dataset:
  name: celeba
  variant: clean

model:
  script: configs/model/config_model_resnet20_celeba.py
  framework: pytorch

pipeline:
  pre_training:
    tools:
      - pre_xgbod_celeba
      - tool: pre_watermarkbn
        command: python3 main.py --trigger_label 1 --exclude_target_class --trigger_size 12
      - pre_noop

  during_training:
    tools:
      - in_fair
      - in_noop_celeba

  post_training:
    tools:
      - post_magnet_celeba
      - post_noop

  deployment:
    tools:
      - deploy_noop
