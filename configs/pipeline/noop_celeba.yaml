# Single-workflow smoke: all stages noop, CelebA + ResNet18.
dataset:
  name: celeba
  variant: clean

model:
  script: configs/model/config_model_resnet18_celeba.py
  framework: pytorch

pipeline:
  pre_training:
    tools:
      - pre_noop
  during_training:
    tools:
      - in_noop_celeba
  post_training:
    tools:
      - post_noop
  deployment:
    tools:
      - deploy_noop
