# Fairness pipeline (new-format tool ids from configs/tools.yaml)
dataset:
  name: celeba
  variant: clean

model:
  script: configs/model/config_model_combined.py
  framework: pytorch

pipeline:
  pre_training:
    tools:
      - pre_noop
  during_training:
    tools:
      - in_fair
      - in_noop
  post_training:
    tools:
      - post_noop
  deployment:
    tools:
      - deploy_noop
