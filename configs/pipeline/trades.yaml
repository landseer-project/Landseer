dataset:
  name: cifar10
  variant: clean
model:
  script: configs/model/config_model_resnet20.py
pipeline:
  pre_training:
    tools:
    - name: pre-xgbod
      container:
        command: python3 main.py
        image: ghcr.io/landseer-project/pre_xgbod:v2
    - name: watermarkbn
      container: 
        command: python3 main.py
        image: ghcr.io/landseer-project/pre_watermarkbn:v1
    noop:
      name: noop
      container:
        image: ghcr.io/landseer-project/pre_noop:v1
        command: python main.py
  during_training:
    tools:
    - name: in-trades
      container:
        image: ghcr.io/landseer-project/in_trades:v1
        command: python3 main.py
    noop:
      name: in_noop
      container:
        image: ghcr.io/landseer-project/in_noop:v5
        command: python main.py
  post_training:
    tools:
    - name: neuroprune
      container:
        image: ghcr.io/landseer-project/post_neuronprune:v1
        command: python3 main.py --prune-percentage 0.1
    noop:
      name: post_noop
      container:
        image: ghcr.io/landseer-project/post_noop_new:v1
        command: python main.py

  deployment:
    tools:
    - name: deploy_dp
      container:
        command: python3 main.py
        config_script: configs/model/config_model_resnet20_dp.py
        image: ghcr.io/landseer-project/deploy_dp:v1
    - name: post_magnet
      container:
        image: ghcr.io/landseer-project/post_magnet:v2
        command: python3 main.py
    - name: deploy_explainshap
      container:
        image: ghcr.io/landseer-project/deploy_explainshap:v1
        command: python3 main.py
    noop:
      name: deploy_noop
      container:
        image: ghcr.io/landseer-project/deploy_noop_docker:v1
        command: python main.py