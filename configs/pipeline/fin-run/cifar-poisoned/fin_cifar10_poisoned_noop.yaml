dataset:
  name: cifar10
  variant: poisoned

model:
  script: configs/model/config_model_resnet20.py
  framework: pytorch

pipeline:
  pre_training:
    tools:
      - pre_noop
      - pre_xgbod
      - tool: pre_watermarkbn
        command: python3 main.py --trigger_label 1 --exclude_target_class --trigger_size 12

  during_training:
    tools:
      - in_noop
  post_training:
    tools:
      - post_noop
      - post_neuronprune
  deployment:
    tools:
      - deploy_noop
      - deploy_explainshap
      - deploy_dataset_inference
