dataset:
  name: cifar10
  variant: clean
model:
  script: configs/model/config_model_orig.py
pipeline:
  pre_training:
    noop:
      name: pre_noop
      container:
        image: oras://ghcr.io/landseer-project/pre_noop:v1
        command: python main.py
  during_training:
    noop:
      name: in_noop
      container:
        image: oras://ghcr.io/landseer-project/in_noop:v5
        command: python main.py
  post_training:
    noop:
      name: post_noop
      container:
        image: oras://ghcr.io/landseer-project/post_noop:v1
        command: python main.py

  deployment:
    noop:
      name: deploy_noop
      container:
        image: oras://ghcr.io/landseer-project/deploy_noop:v1
        command: python main.py
