dataset:
  name: cifar10
  variant: clean

model:
  script: configs/model/config_model_resnet20.py
  framework: pytorch

pipeline:
  pre_training:
    noop:
      name: noop
      container:
        image: ghcr.io/landseer-project/pre_noop:v1
        command: python main.py

  during_training:
    tools:
      - name: in_orat
        container:
          image: oras://ghcr.io/landseer-project/in_orat:v3
          command: python /workspace/orat/main.py --epochs 120 --eval-every 10 --epsilon 0.031372549 --step_size 0.007843137
    noop:
      name: in_noop
      container:
        image: ghcr.io/landseer-project/in_noop:v5
        command: python main.py

  post_training:
    noop:
      name: post_noop
      container:
        image: ghcr.io/landseer-project/post_noop_new:v1
        command: python main.py

  deployment:
    noop:
      name: deploy_noop
      container:
        image: ghcr.io/landseer-project/deploy_noop_docker:v1
        command: python main.py
