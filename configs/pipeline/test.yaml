dataset:
  name: cifar10
  variant: clean
model:
  script: configs/model/config_model_resnet20.py
  framework: pytorch
pipeline:
  pre_training:
    noop:
      name: noop
      container:
        image: ghcr.io/landseer-project/pre_noop:v1
        command: python main.py
  during_training:
    noop:
      name: in_noop
      container:
        image: ghcr.io/landseer-project/in_noop:v5
        command: python main.py
  post_training:
    tools:
    - name: fine pruning
      container:
        image: ghcr.io/landseer-project/post_fineprune:v1
        command: python3 main.py --prune-percentage 0.1

  deployment:
    tools:
    - name: deploy_dp
      container:
        command: python3 main.py
        config_script: configs/model/config_model.py
        image: ghcr.io/landseer-project/deploy_dp:v1
