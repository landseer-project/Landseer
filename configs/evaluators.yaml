# Evaluator containers. This file is required: it is the only source of evaluator
# definitions, and a missing or invalid file stops the pipeline from loading.
# Published images: ghcr.io/landseer-project/evals/<name>:<tag>.
# artifact_roots: optional host directories that contain evaluator sidecars.
# Can be set globally (here) and/or per evaluator.
# input: what the evaluator gets as /input. `final` (default) = dataset plus every
#   upstream output; `training_input` = exactly the input of the workflow's
#   in-training task (dataset plus pre-training outputs).
# enabled_by_attacks: attack-config flags that select this evaluator.
#
artifact_roots:
  - /data/landseer/eval_artifacts

evaluators:
  clean:
    name: clean
    container:
      image: ghcr.io/landseer-project/evals/clean:v3
      command: ""
    required_artifacts: []
    metrics:
      - clean_accuracy
      - clean_train_accuracy
      - poisoned_train_accuracy
      - poisoned_test_accuracy
      - mia_auc
      - privacy_epsilon
      - dp_accuracy
    defense_types: []

  backdoor:
    name: backdoor
    container:
      image: ghcr.io/landseer-project/evals/backdoor:v3
      command: ""
    required_artifacts:
      - poisoning_metadata.json
    applies_to:
      dataset_variants: [poisoned]
    metrics:
      - attack_success_rate
      - clean_accuracy_post_attack
      - backdoor_robustness
    defense_types:
      - backdoor

  adversarial:
    name: adversarial
    container:
      image: ghcr.io/landseer-project/evals/adversarial:v2
      command: ""
    required_artifacts: []
    metrics:
      - clean_accuracy
      - pgd_accuracy
      - fgsm_accuracy
      - carlini_l2_accuracy
    defense_types:
      - adversarial

  fairness:
    name: fairness
    container:
      image: ghcr.io/landseer-project/evals/fairness:v3
      command: ""
    required_artifacts:
      - test_sensitive.npy
    # in_fair writes test_sensitive.npy (and its own test split); no other tool does
    applies_to:
      tools: [in_fair]
    metrics:
      - demographic_parity
      - equalized_odds_diff
    defense_types:
      - fairness

  fingerprinting:
    name: fingerprinting
    container:
      image: ghcr.io/landseer-project/evals/fingerprinting:v2
      command: ""
    required_artifacts: []
    metrics:
      - mingd_score
      - fingerprint_accuracy
    defense_types:
      - fingerprinting

  ood:
    name: ood
    container:
      image: ghcr.io/landseer-project/evals/ood:v4
      command: ""
    required_artifacts: []
    metrics:
      - ood_auc
      - fpr_at_95_tpr
    defense_types:
      - outlier_removal

  sanitization:
    name: sanitization
    container:
      image: ghcr.io/landseer-project/evals/sanitization:v2
      command: ""
    required_artifacts: []
    input: training_input
    enabled_by_attacks:
      - backdoor
      - outlier
    applies_to:
      dataset_variants:
        - poisoned
      tools:
        - pre-xgbod
        - pre-xgbod-celeba
    metrics:
      - xgbod_train_roc_auc
      - xgbod_train_precision_at_n
    defense_types:
      - outlier_removal

  watermark:
    name: watermark
    container:
      image: ghcr.io/landseer-project/evals/watermark:v4
      command: ""
    required_artifacts: []
      # - watermark_key.json
    metrics:
      - watermark_accuracy
      - bit_accuracy
      - detection_rate
      - wmacc_badnets
    defense_types:
      - watermarking

  fingerprinting_llm:
    name: fingerprinting_llm
    container:
      image: ghcr.io/landseer-project/evals/cka_llm:v3
      command: ""
    required_artifacts: []
    metrics:
      - cka_sim
    defense_types:
      - reef

  asr_llm:
    name: asr_llm
    container:
      image: ghcr.io/landseer-project/evals/asr_llm:v7
      command: ""
    required_artifacts: []
    metrics:
      - llm_asr
    defense_types:
      - door


  explanations:
    name: explanations
    container:
      image: ghcr.io/landseer-project/evals/explanations:v3
      command: ""
    required_artifacts: []
    metrics:
      - drop10_score
    defense_types:
      - explainability

  privacy:
    name: privacy
    container:
      image: ghcr.io/landseer-project/evals/privacy:v4
      command: ""
    # Shadow models are built into the image (/app/celeba_shadows, identical to
    # /data/landseer/eval_artifacts/celeba_shadows); requiring a host copy made
    # privacy fail on every worker that was not set up by hand. They are CelebA
    # models, so privacy cannot evaluate other datasets.
    required_artifacts: []
    applies_to:
      datasets: [celeba]
    metrics:
      - mia_auc
    defense_types:
      - differential_privacy

