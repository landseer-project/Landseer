# Evaluator containers (merged on top of built-in defaults in code).
# Built-ins always include all evaluators; override here for registry paths/tags.
# Published images: ghcr.io/landseer-project/evals/<name>:<tag>.
# artifact_roots: optional host directories that contain evaluator sidecars.
# Can be set globally (here) and/or per evaluator.
#
artifact_roots:
  - /data/landseer/eval_artifacts
evaluators:
  clean:
    required_artifacts:
      - celeba_shadows

evaluators:
  clean:
    name: clean
    container:
      # local cpu build, see containers/evals/clean/Dockerfile.cpu. the ghcr
      # image is a cuda build and the registry is private.
      image: landseer/eval_clean:cpu
      command: ""
    required_artifacts: []
    metrics:
      - clean_accuracy
      - clean_train_accuracy
      - poisoned_train_accuracy
      - poisoned_test_accuracy
      - mia_auc
      - privacy_epsilon
      - dp_accuracy
    defense_types: []

  backdoor:
    name: backdoor
    container:
      image: ghcr.io/landseer-project/evals/backdoor:v2
      command: ""
    required_artifacts:
      - poisoning_metadata.json
    metrics:
      - attack_success_rate
      - clean_accuracy_post_attack
      - backdoor_robustness
    defense_types:
      - backdoor

  adversarial:
    name: adversarial
    container:
      image: landseer/eval_adversarial:cpu
      command: ""
    required_artifacts: []
    metrics:
      - clean_accuracy
      - pgd_accuracy
      - fgsm_accuracy
      - carlini_l2_accuracy
    defense_types:
      - adversarial

  fairness:
    name: fairness
    container:
      image: ghcr.io/landseer-project/evals/fairness:v2
      command: ""
    required_artifacts:
      - sensitive_attributes.npy
    metrics:
      - demographic_parity
      - equalized_odds_diff
    defense_types:
      - fairness

  fingerprinting:
    name: fingerprinting
    container:
      image: landseer/eval_fingerprinting:cpu
      command: ""
    required_artifacts: []
    metrics:
      - mingd_score
      - fingerprint_accuracy
    defense_types:
      - fingerprinting

  ood:
    name: ood
    container:
      image: landseer/eval_ood:cpu
      command: ""
    required_artifacts: []
    metrics:
      - ood_auc
      - fpr_at_95_tpr
    defense_types:
      - outlier_removal

  watermark:
    name: watermark
    container:
      image: ghcr.io/landseer-project/evals/watermark:v2
      command: ""
    required_artifacts:
      - watermark_key.json
    metrics:
      - watermark_accuracy
      - bit_accuracy
      - detection_rate
      - wmacc_badnets
    defense_types:
      - watermarking

  fingerprinting_llm:
    name: fingerprinting_llm
    container:
      image: landseer/eval_cka:cpu
      command: ""
    # this one is for llm pipelines, it reads gpt2 activations from /input/gpt2.
    # declaring it here means the worker skips it on image pipelines like mnist
    # instead of running it and failing.
    required_artifacts:
      - gpt2
    metrics:
      - cka_sim
    defense_types:
      - reef

  explanations:
    name: explanations
    container:
      image: landseer/eval_explanations:cpu
      command: ""
    required_artifacts: []
    metrics:
      - drop10_score
    defense_types:
      - explainability

  privacy:
    name: privacy
    container:
      image: landseer/eval_privacy:cpu
      command: ""
    required_artifacts: []
    metrics:
      - mia_auc
    defense_types:
      - differential_privacy

  reef_cka:
    name: reef_cka
    container:
      image: landseer/eval_cka:cpu
      command: ""
    required_artifacts:
      - gpt2
    metrics:
      - cka_sim
    defense_types: []
