# Pin tools to workers. A task whose tool is listed here is handed only to
# workers whose id starts with one of the given prefixes (simurgh-gpu0,
# gilbreth-11984977, fabiha, ...); every other task goes to any worker.
# Keys are tool registry keys or names ("deploy_explainshap_celeba").
# The backend re-reads this file when it changes: no restart needed.
# A pinned task waits while no matching worker is up.
pins:
  # 4-4.6 h on gilbreth (plus hours of input staging), where it also failed
  # on the scratch quota; about 2.9 h on simurgh and 1.4 h on fabiha.
  deploy_explainshap_celeba: [simurgh-, fabiha]
