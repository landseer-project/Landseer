# Copy to configs/evaluators.yaml. Tags match tools/evals/README.md builds.

evaluators:
  clean:
    name: clean
    container:
      image: evals/clean:artifact
      command: ""
    required_artifacts: []
    metrics:
      - clean_accuracy
    defense_types: []

  backdoor:
    name: backdoor
    container:
      image: evals/backdoor:artifact
      command: ""
    required_artifacts:
      - poisoning_metadata.json
    metrics:
      - attack_success_rate
      - clean_accuracy_post_attack
      - backdoor_robustness
    defense_types:
      - backdoor

  adversarial:
    name: adversarial
    container:
      image: evals/adversarial:artifact
      command: ""
    required_artifacts: []
    metrics:
      - clean_accuracy
      - pgd_accuracy
      - fgsm_accuracy
      - carlini_l2_accuracy
    defense_types:
      - adversarial

  fairness:
    name: fairness
    container:
      image: evals/fairness:artifact
      command: ""
    required_artifacts:
      - sensitive_attributes.npy
    metrics:
      - demographic_parity
      - equalized_odds_diff
    defense_types:
      - fairness

  fingerprinting:
    name: fingerprinting
    container:
      image: evals/fingerprinting:artifact
      command: ""
    required_artifacts: []
    metrics:
      - mingd_score
      - fingerprint_accuracy
    defense_types:
      - fingerprinting

  ood:
    name: ood
    container:
      image: evals/ood:artifact
      command: ""
    required_artifacts: []
    metrics:
      - ood_auc
      - fpr_at_95_tpr
    defense_types:
      - outlier_removal

  watermark:
    name: watermark
    container:
      image: evals/watermark:artifact
      command: ""
    required_artifacts:
      - watermark_key.json
    metrics:
      - watermark_accuracy
      - bit_accuracy
      - detection_rate
    defense_types:
      - watermarking
