datasets:
  cifar10:
    default_image: ghcr.io/landseer-project/dataset_cifar10:v1
    required_files:
      - data.npy
      - labels.npy
      - test_data.npy
      - test_labels.npy
    variants:
      clean:
        image: ghcr.io/landseer-project/dataset_cifar10:v1
        labels:
          landseer.dataset: cifar10
          landseer.variant: clean
      poisoned:
        # No loader image: the BadNets set (5%, 3x3 trigger, target class 0) is
        # already prepared under <data root>/cifar10/poisoned. An empty image
        # makes a missing dir fail instead of falling back to the clean loader.
        image: ""
        # See celeba/poisoned: ship the poison ground truth with the dataset.
        required_files:
          - data.npy
          - labels.npy
          - test_data.npy
          - test_labels.npy
          - poisoning_metadata.json
        labels:
          landseer.dataset: cifar10
          landseer.variant: poisoned

  celeba:
    default_image: ghcr.io/landseer-project/datasets/celeba:v2
    source_artifacts_dir: /data/landseer/landseer_old_data/data/celeba/downloaded_dataset
    required_files:
      - data.npy
      - labels.npy
      - test_data.npy
      - test_labels.npy
      - filenames.npy
      - test_filenames.npy
    required_dirs:
      - img_align_celeba
    variants:
      clean:
        image: ghcr.io/landseer-project/datasets/celeba:v2
        labels:
          landseer.dataset: celeba
          landseer.variant: clean
      poisoned:
        image: ghcr.io/landseer-project/dataset_celeba_poisoned:v4
        # poisoning_metadata.json must ship with the dataset: xgbod reads it as
        # poison ground truth (without it xgbod silently keeps every sample) and
        # the backdoor evaluator needs it. Listing it puts it in the manifest, so
        # workers that sync the dataset from MinIO get it too.
        required_files:
          - data.npy
          - labels.npy
          - test_data.npy
          - test_labels.npy
          - filenames.npy
          - test_filenames.npy
          - poisoning_metadata.json
        labels:
          landseer.dataset: celeba
          landseer.variant: poisoned

  llm_data:
    default_image: ""
    source_artifacts_dir: /data/landseer/landseer_old_data/data
    required_files:
      - truthfulqa.csv
      - data.npy
      - labels.npy
      - test_data.npy
      - test_labels.npy
      - gemma-2-2b-it-prefix-good.jsonl
      - gemma-2-2b-it-prefix-bad.jsonl
      - alpaca_cleaned.jsonl
      - gemma-2-2b-it-bad-eval.jsonl


    required_dirs:
      - gemma-2-2b
      - gemma-2-2b-it
      # - gpt2
      # - gpt2-imdb
    variants:
      clean:
        labels:
          landseer.dataset: llm_data
          landseer.variant: clean

  mnist:
    # TODO: add dataset_mnist container image when available
    default_image: ""
    required_files:
      - data.npy
      - labels.npy
      - test_data.npy
      - test_labels.npy
    variants:
      clean:
        labels:
          landseer.dataset: mnist
          landseer.variant: clean
