datasets:
  cifar10:
    default_image: ghcr.io/landseer-project/dataset_cifar10:v1
    required_files:
      - data.npy
      - labels.npy
      - test_data.npy
      - test_labels.npy
    variants:
      clean:
        image: ghcr.io/landseer-project/dataset_cifar10:v1
        labels:
          landseer.dataset: cifar10
          landseer.variant: clean

  celeba:
    default_image: ghcr.io/landseer-project/dataset_celeba:v1
    source_artifacts_dir: /data/landseer/landseer_old_data/data/celeba/downloaded_dataset
    required_files:
      - data.npy
      - labels.npy
      - test_data.npy
      - test_labels.npy
      - filenames.npy
      - test_filenames.npy
    required_dirs:
      - img_align_celeba
    variants:
      clean:
        image: ghcr.io/landseer-project/dataset_celeba:v1
        labels:
          landseer.dataset: celeba
          landseer.variant: clean

  mnist:
    # TODO: add dataset_mnist container image when available
    default_image: ""
    required_files:
      - data.npy
      - labels.npy
      - test_data.npy
      - test_labels.npy
    variants:
      clean:
        labels:
          landseer.dataset: mnist
          landseer.variant: clean
