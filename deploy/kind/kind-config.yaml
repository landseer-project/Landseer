kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: landseer
nodes:
  - role: control-plane
    extraPortMappings:
      # MinIO API (NodePort 30900) -> host 9000 so worker on the host can talk to it.
      - containerPort: 30900
        hostPort: 9000
        protocol: TCP
      # MinIO console (NodePort 30901) -> host 9001 for the web UI.
      - containerPort: 30901
        hostPort: 9001
        protocol: TCP
  - role: worker
  - role: worker
