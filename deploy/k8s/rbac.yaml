apiVersion: v1
kind: ServiceAccount
metadata:
  name: landseer-worker
  namespace: landseer-workers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: landseer-worker
  namespace: landseer-workers
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: landseer-worker
  namespace: landseer-workers
subjects:
  - kind: ServiceAccount
    name: landseer-worker
    namespace: landseer-workers
roleRef:
  kind: Role
  name: landseer-worker
  apiGroup: rbac.authorization.k8s.io
